<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風鳥堂 - 菜單與即時訂單管理後台</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #d97706;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding-bottom: 60px; }

        header { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: white; padding: 1.2rem 1rem; text-align: center; position: sticky; top: 0; z-index: 30; }
        .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 1rem 0.75rem; }

        .stats-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
        .stat-card { background: white; border-radius: var(--radius); padding: 1rem; border: 1px solid var(--border-color); text-align: center; }
        .stat-value { font-size: 1.35rem; font-weight: 800; color: var(--primary); margin-top: 0.2rem; }

        /* 區塊標題 */
        .section-header-title {
            font-size: 1.25rem; font-weight: 800; color: var(--primary); margin: 1.5rem 0 0.8rem;
            display: flex; align-items: center; justify-content: space-between; border-bottom: 2.5px solid var(--primary); padding-bottom: 0.4rem;
        }

        /* 📋 下方訂單看板卡片樣式 */
        .order-manage-card {
            background: white; border-radius: var(--radius); padding: 1rem; margin-bottom: 0.85rem;
            border: 1.5px solid var(--border-color); box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .order-manage-card.status-prep { border-left: 6px solid #f59e0b; }
        .order-manage-card.status-done { border-left: 6px solid #22c55e; background: #f0fdf4; }
        .order-manage-card.status-taken { border-left: 6px solid #94a3b8; opacity: 0.7; }

        .btn-status-toggle { padding: 0.5rem 1rem; border-radius: 8px; font-weight: 800; border: none; cursor: pointer; font-size: 0.85rem; }
        .btn-status-prep { background: #fef3c7; color: #d97706; }
        .btn-status-done { background: #22c55e; color: white; }
        .btn-status-taken { background: #e2e8f0; color: #475569; }

        /* 上方菜單品項卡片 */
        .item-card { background: white; border-radius: var(--radius); padding: 0.85rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
        .toggle-btn { padding: 0.5rem 1rem; border-radius: 8px; font-weight: 800; border: none; cursor: pointer; }
        .toggle-btn.on { background-color: #dcfce7; color: #15803d; }
        .toggle-btn.off { background-color: #ef4444; color: white; }
    </style>
</head>
<body>

    <header>
        <div style="font-size:1.35rem; font-weight:800;">⚡ 風鳥堂 - 全功能管理後台</div>
        <div style="font-size:0.85rem; opacity:0.85;">上方菜單價格控管 ‧ 下方即時訂單狀態處理</div>
    </header>

    <div class="container">

        <!-- 區塊一：上方菜單與價格管理 -->
        <div class="section-header-title">
            <span><i class="fa-solid fa-list-check"></i> 菜單缺貨與價格調整</span>
        </div>
        <div id="adminMenuContainer">
            <div style="text-align:center; padding:1.5rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 載入菜單數據...</div>
        </div>

        <hr style="margin: 2rem 0; border: none; border-top: 2px dashed #cbd5e1;">

        <!-- 區塊二：下方即時訂單管理看板 -->
        <div class="section-header-title">
            <span><i class="fa-solid fa-receipt"></i> 今日即時訂單看板</span>
            <button onclick="fetchOrdersData()" style="background:var(--primary); color:white; border:none; padding:0.3rem 0.8rem; border-radius:6px; font-size:0.8rem; cursor:pointer;">
                <i class="fa-solid fa-rotate"></i> 整理刷新
            </button>
        </div>
        <div id="ordersListContainer">
            <div style="text-align:center; padding:1.5rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 載入訂單資料...</div>
        </div>

    </div>

    <script>
        const SPREADSHEET_ID = '1_5ynzti6fA6RUq5UUjB28oxw2u2eFMs4RiGRzUmKvQU';
        const MENU_SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxpuB_w20nq4ZtldzABmuVqu-iUUgDFW1nBQpuFP2j_8Yj2cv7qla-atfDfCWDFxxb5RA/exec';

        // 📋 讀取今天所有訂單與狀態
        async function fetchOrdersData() {
            const container = document.getElementById('ordersListContainer');
            try {
                const res = await fetch(`${GAS_WEB_APP_URL}?action=getOrders&t=${Date.now()}`);
                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:2rem;">今日尚無訂單資料！</div>';
                    return;
                }

                let html = '';
                // 倒序顯示最新訂單在最上面
                orders.reverse().forEach(o => {
                    let cardClass = 'status-prep';
                    let btnHtml = `<button class="btn-status-toggle btn-status-prep" onclick="changeOrderStatus(${o.row}, '已完成')">⏳ 備餐中 (點擊改為完成)</button>`;

                    if (o.status === '已完成') {
                        cardClass = 'status-done';
                        btnHtml = `<button class="btn-status-toggle btn-status-done" onclick="changeOrderStatus(${o.row}, '已取餐')">✅ 已完成 (點擊改為已取餐)</button>`;
                    } else if (o.status === '已取餐') {
                        cardClass = 'status-taken';
                        btnHtml = `<button class="btn-status-toggle btn-status-taken" onclick="changeOrderStatus(${o.row}, '備餐中')">🎉 已取餐 (點擊重設)</button>`;
                    }

                    html += `
                        <div class="order-manage-card ${cardClass}">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
                                <div>
                                    <span style="font-weight:800; font-size:1.1rem;">👤 ${o.name}</span>
                                    <span style="font-size:0.85rem; color:var(--text-muted); margin-left:0.5rem;">📞 ${o.phone}</span>
                                </div>
                                <div style="font-weight:800; color:#b91c1c; font-size:1rem;">⏰ ${o.pickupTime}</div>
                            </div>
                            <div style="font-size:0.9rem; color:var(--text-dark); margin-bottom:0.5rem; background:#f8fafc; padding:0.5rem; border-radius:6px;">
                                明細：${o.items}
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <div style="font-weight:800; color:var(--accent);">$${o.total} 元 (${o.payMethod})</div>
                                <div>${btnHtml}</div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = '<div style="text-align:center; color:#ef4444; padding:2rem;">載入訂單失敗！</div>';
            }
        }

        // 🎯 一鍵切換訂單狀態
        async function changeOrderStatus(row, newStatus) {
            if (navigator.vibrate) navigator.vibrate(40);
            try {
                const url = `${GAS_WEB_APP_URL}?action=updateOrderStatus&row=${row}&status=${encodeURIComponent(newStatus)}&t=${Date.now()}`;
                await fetch(url);
                fetchOrdersData(); // 重新整理列表
            } catch (e) {
                alert('更新訂單狀態失敗！');
            }
        }

        // 載入上方菜單
        async function fetchAdminMenu() {
            try {
                const res = await fetch(MENU_SHEET_URL).then(r => r.text());
                const json = JSON.parse(res.substring(47, res.length - 2));
                const categoriesMap = {};

                json.table.rows.forEach(row => {
                    const c = row.c;
                    if (!c) return;
                    const catId = c[0] ? String(c[0].v || '') : '';
                    const catTitle = c[1] ? String(c[1].v || '') : '';
                    const rawName = c[2] ? String(c[2].v || '') : '';
                    const price = c[3] ? Number(c[3].v || 0) : 0;
                    const status = c[5] ? String(c[5].v || '上架') : '上架';

                    if (!rawName || rawName.includes('平台開關')) return;

                    if (!categoriesMap[catId]) {
                        categoriesMap[catId] = { title: catTitle, items: [] };
                    }
                    categoriesMap[catId].items.push({ name: rawName, price, status });
                });

                let container = document.getElementById('adminMenuContainer');
                container.innerHTML = '';

                Object.values(categoriesMap).forEach(cat => {
                    let itemsHtml = cat.items.map(item => {
                        const isSoldOut = item.status === '售完';
                        return `
                            <div class="item-card">
                                <div>
                                    <div style="font-weight:800;">${item.name}</div>
                                    <div style="font-size:0.85rem; color:var(--accent);">價格: $${item.price}</div>
                                </div>
                                <button class="toggle-btn ${isSoldOut ? 'off' : 'on'}" onclick="toggleItemStatus(this, '${item.name}')">
                                    ${isSoldOut ? '已售完' : '供應中'}
                                </button>
                            </div>
                        `;
                    }).join('');

                    container.innerHTML += `<div style="font-weight:bold; margin:1rem 0 0.5rem; color:var(--primary);">${cat.title}</div>${itemsHtml}`;
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function toggleItemStatus(btn, itemName) {
            const isSoldOut = btn.classList.contains('off');
            const newStatus = isSoldOut ? '上架' : '售完';
            btn.className = `toggle-btn ${isSoldOut ? 'on' : 'off'}`;
            btn.innerText = isSoldOut ? '供應中' : '已售完';
            
            const url = `${GAS_WEB_APP_URL}?action=updateStatus&name=${encodeURIComponent(itemName)}&val=${encodeURIComponent(newStatus)}&t=${Date.now()}`;
            new Image().src = url;
        }

        fetchOrdersData();
        fetchAdminMenu();
        // 每 30 秒自動重新整理訂單看板
        setInterval(fetchOrdersData, 30000);
    </script>
</body>
</html>
