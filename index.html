<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風鳥堂 - 線上訂餐</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --accent: #d97706;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding-bottom: 80px; }

        /* 🔍 浮動追蹤訂單按鈕 */
        .track-float-btn {
            position: fixed; top: 12px; right: 12px; z-index: 60;
            background: #f59e0b; color: white; border: none; padding: 0.45rem 0.9rem;
            border-radius: 20px; font-weight: 800; font-size: 0.85rem; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 0.35rem;
        }

        .marquee-container { background: #fef3c7; color: #92400e; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 700; overflow: hidden; white-space: nowrap; border-bottom: 1px solid #fde68a; }
        .marquee-content { display: inline-block; padding-left: 100%; animation: marquee 18s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        header { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: white; padding: 2rem 1rem 1.2rem; text-align: center; box-shadow: var(--shadow); }
        .container { max-width: 1000px; margin: 0 auto; padding: 1rem; }

        .closed-overlay { background: #fee2e2; color: #991b1b; padding: 1rem; text-align: center; font-weight: bold; border-radius: var(--radius); margin-bottom: 1.5rem; display: none; }

        .category-nav { display: flex; overflow-x: auto; white-space: nowrap; padding: 0.75rem 0; margin-bottom: 1.5rem; background: white; border-radius: var(--radius); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
        .category-btn { background: none; border: none; padding: 0.6rem 1.2rem; font-size: 0.95rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 20px; margin: 0 0.25rem; }
        .category-btn.active { color: white; background-color: var(--primary); }

        .section-title { font-size: 1.3rem; font-weight: 700; margin: 1.5rem 0 1rem; color: var(--primary); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
        .menu-card { background: white; border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 12px; }
        .menu-card.sold-out { opacity: 0.5; cursor: not-allowed; background: #f1f5f9; }

        .item-info { flex: 1; min-width: 0; }
        .item-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.25rem; }
        .item-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .item-price { font-weight: 700; color: var(--accent); font-size: 1rem; }
        .add-btn { background-color: #f1f5f9; color: var(--primary); border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }

        .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: white; border-radius: var(--radius); width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 1.5rem; }
        .form-input, .form-select { width: 100%; padding: 0.6rem; margin-top: 0.3rem; margin-bottom: 0.8rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; background: white; }
        .btn-primary { background-color: #06c755; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 20px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 1rem; }

        .cart-bar { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); width: calc(100% - 2rem); max-width: 960px; background-color: var(--text-dark); color: white; padding: 0.8rem 1.2rem; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); z-index: 50; cursor: pointer; }
        .cart-badge { background-color: var(--accent); color: white; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-left: 0.5rem; }

        .order-status-card { background: #f8fafc; border: 1.5px solid var(--border-color); border-radius: 12px; padding: 1rem; margin-bottom: 0.75rem; }
        .status-badge-prep { background: #fef3c7; color: #d97706; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; }
        .status-badge-done { background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; }
        .status-badge-taken { background: #e2e8f0; color: #64748b; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; }
    </style>
</head>
<body>

    <button class="track-float-btn" onclick="openTrackModal()">
        <i class="fa-solid fa-magnifying-glass"></i> 追蹤訂單
    </button>

    <div class="marquee-container">
        <div class="marquee-content">🎉 全店慶慶祝中！單筆點餐滿 $300 元即免費贈送『招牌風鳥茶』乙杯！</div>
    </div>

    <header>
        <div class="header-title">風鳥堂林口中山店</div>
        <div class="header-subtitle">官方 LINE ID: @694hwlae ‧ 電話：02-26011950</div>
    </header>

    <div class="container">
        <div class="closed-overlay" id="closedOverlay">
            <i class="fa-solid fa-store-slash"></i> <span id="closedMsg">目前為非營業時間，暫不開放線上點餐！</span>
        </div>

        <nav class="category-nav" id="categoryNav">
            <button class="category-btn active">載入中...</button>
        </nav>

        <div id="menuContainer">
            <div class="loading-box" id="loadingBox" style="text-align:center; padding:3rem; color:var(--text-muted);">
                <i class="fa-solid fa-spinner fa-spin"></i> 菜單載入中，請稍候...
            </div>
        </div>
    </div>

    <div class="cart-bar" id="cartBar" onclick="openCartModal()">
        <div><i class="fa-solid fa-shopping-bag"></i><span class="cart-badge" id="cartCount">0</span></div>
        <div>總計: <span id="cartTotal">$0</span> 前往結帳 ➔</div>
    </div>

    <!-- 🔍 追蹤訂單 Modal -->
    <div class="modal-backdrop" id="trackModal">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h3 style="font-weight:800; color:var(--primary);"><i class="fa-solid fa-clock-rotate-left"></i> 追蹤訂單進度</h3>
                <button style="background:none; border:none; font-size:1.25rem; cursor:pointer;" onclick="closeModal('trackModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div style="margin-bottom:1rem;">
                <label style="font-size:0.85rem; font-weight:bold;">輸入訂購電話查詢：</label>
                <div style="display:flex; gap:0.5rem; margin-top:0.3rem;">
                    <input type="tel" id="trackPhoneInput" class="form-input" style="margin-bottom:0;" placeholder="例如：0912345678">
                    <button onclick="queryOrdersByPhone()" style="background:var(--primary); color:white; border:none; padding:0 1.2rem; border-radius:6px; font-weight:bold; cursor:pointer;">查詢</button>
                </div>
            </div>

            <div id="trackResultList">
                <div style="text-align:center; color:var(--text-muted); padding:1.5rem;">請輸入電話號碼查詢今日訂單進度</div>
            </div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1_5ynzti6fA6RUq5UUjB28oxw2u2eFMs4RiGRzUmKvQU';
        const MENU_SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxpuB_w20nq4ZtldzABmuVqu-iUUgDFW1nBQpuFP2j_8Yj2cv7qla-atfDfCWDFxxb5RA/exec';

        let menuData = [];

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function openTrackModal() {
            document.getElementById('trackModal').classList.add('active');
            const savedPhone = localStorage.getItem('feng_last_phone');
            if (savedPhone) {
                document.getElementById('trackPhoneInput').value = savedPhone;
                queryOrdersByPhone();
            }
        }

        // 🔍 安全查詢訂單
        async function queryOrdersByPhone() {
            const phone = document.getElementById('trackPhoneInput').value.trim();
            const resultBox = document.getElementById('trackResultList');
            if (!phone) { alert('請輸入電話！'); return; }

            resultBox.innerHTML = '<div style="text-align:center; padding:1.5rem;"><i class="fa-solid fa-spinner fa-spin"></i> 查詢中...</div>';

            try {
                const res = await fetch(`${GAS_WEB_APP_URL}?action=getOrders&phone=${encodeURIComponent(phone)}&t=${Date.now()}`);
                const userOrders = await res.json();

                if (!userOrders || userOrders.length === 0) {
                    resultBox.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:1.5rem;">查無今日訂單紀錄！</div>';
                    return;
                }

                userOrders.reverse();
                let html = '';
                userOrders.forEach(o => {
                    let badge = '<span class="status-badge-prep">⏳ 備餐製作中</span>';
                    if (o.status === '已完成') badge = '<span class="status-badge-done">✅ 製作完成，請至櫃檯取餐！</span>';
                    else if (o.status === '已取餐') badge = '<span class="status-badge-taken">🎉 已完成取餐</span>';

                    html += `
                        <div class="order-status-card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem;">
                                <span style="font-size:0.8rem; color:var(--text-muted);">${o.time}</span>
                                ${badge}
                            </div>
                            <div style="font-weight:bold; font-size:0.95rem;">⏰ 取餐：${o.pickupTime}</div>
                            <div style="font-size:0.85rem; margin:0.3rem 0;">📦 明細：${o.items}</div>
                            <div style="font-weight:800; color:var(--accent);">總計：$${o.total} 元 (${o.payMethod})</div>
                        </div>
                    `;
                });
                resultBox.innerHTML = html;
            } catch (err) {
                resultBox.innerHTML = '<div style="text-align:center; color:#ef4444; padding:1.5rem;">查詢失敗，請檢查網路連線！</div>';
            }
        }

        // 💡 載入菜單（具備 8 秒逾時防護，絕不卡載入中）
        async function fetchMenuFromSheet() {
            const container = document.getElementById('menuContainer');
            
            // 加上 8 秒逾時保護計時器
            const timeoutPromise = new Promise((_, reject) => 
                setTimeout(() => reject(new Error('連線逾時')), 8000)
            );

            try {
                const fetchPromise = fetch(MENU_SHEET_URL).then(r => r.text());
                const text = await Promise.race([fetchPromise, timeoutPromise]);
                
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?/);
                if (!match) throw new Error("無效的資料格式");
                
                const json = JSON.parse(match[1]);
                const categoriesMap = {};

                json.table.rows.forEach(row => {
                    const c = row.c;
                    if (!c) return;
                    const catId = c[0] ? String(c[0].v || '') : '';
                    const catTitle = c[1] ? String(c[1].v || '') : '';
                    const rawName = c[2] ? String(c[2].v || '') : '';
                    const price = c[3] ? Number(c[3].v || 0) : 0;
                    const desc = c[4] ? String(c[4].v || '') : '';
                    const status = c[5] ? String(c[5].v || '上架') : '上架';

                    if (status === '下架' || !rawName || rawName.includes('平台開關')) return;

                    if (!categoriesMap[catId]) {
                        categoriesMap[catId] = { id: catId, title: catTitle, items: [] };
                    }
                    categoriesMap[catId].items.push({ name: rawName, price, desc, status });
                });

                menuData = Object.values(categoriesMap);
                renderMenu();
            } catch (err) {
                console.error("載入菜單失敗", err);
                container.innerHTML = `
                    <div style="text-align:center; padding:3rem; color:#ef4444;">
                        ❌ 菜單載入失敗（${err.message}）<br>
                        <button onclick="fetchMenuFromSheet()" style="margin-top:1rem; padding:0.5rem 1rem; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer;">重新整理</button>
                    </div>`;
            }
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';
            menuData.forEach(cat => {
                const section = document.createElement('section');
                section.className = 'menu-section';
                let itemsHtml = cat.items.map(item => {
                    const isSoldOut = item.status === '售完';
                    return `
                        <div class="menu-card ${isSoldOut ? 'sold-out' : ''}">
                            <div class="item-info">
                                <div class="item-name">${item.name} ${isSoldOut ? '<span class="sold-badge">已售完</span>' : ''}</div>
                                <div class="item-desc">${item.desc}</div>
                                <div class="item-price">$${item.price}</div>
                            </div>
                            <button class="add-btn"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    `;
                }).join('');
                section.innerHTML = `<div class="section-title">${cat.title}</div><div class="menu-grid">${itemsHtml}</div>`;
                container.appendChild(section);
            });
        }

        fetchMenuFromSheet();
    </script>
</body>
</html>
