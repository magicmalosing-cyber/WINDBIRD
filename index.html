<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風鳥堂 - 線上點餐系統</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fdfbf7; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c5e3b; font-size: 24px; }
        .menu-category { margin-bottom: 20px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .item-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .item-info p { margin: 0; color: #777; font-size: 13px; }
        .btn-order { background: #2c5e3b; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-order:hover { background: #1e3f27; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍵 風鳥堂 (Windbird) 線上點餐</h1>
    <p style="text-align: center; color: #666; font-size: 14px;">官方帳號：@694ptdsi</p>
    
    <div class="menu-category">
        <h2>精選人氣飲品</h2>
        <div id="menu-list">
            <div class="item">
                <div class="item-info">
                    <h3>漫越橙露</h3>
                    <p>蔓越莓與香橙綠茶的完美結合</p>
                </div>
                <button class="btn-order" onclick="submitOrder('漫越橙露', 65)">點餐 ($65)</button>
            </div>
            <div class="item">
                <div class="item-info">
                    <h3>老派紅茶</h3>
                    <p>經典濃郁古早風味紅茶</p>
                </div>
                <button class="btn-order" onclick="submitOrder('老派紅茶', 40)">點餐 ($40)</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ⚠️ 請將下方引號內的網址，換成您在 Google Apps Script 部署後取得的「網頁應用程式 URL」
    const WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    function submitOrder(itemName, price) {
        const orderData = {
            item: itemName,
            price: price,
            time: new Date().toLocaleString()
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(orderData)
        }).then(() => {
            alert("訂單已送出！風鳥堂已收到您的點餐。");
        }).catch(error => {
            console.error("送出失敗:", error);
            alert("送出失敗，請稍後再試。");
        });
    }
</script>

</body>
</html>
