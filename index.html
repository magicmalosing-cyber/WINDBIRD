<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風鳥堂 - 線上訂餐</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a; --primary-light: #3b82f6; --accent: #d97706;
            --bg-light: #f8fafc; --text-dark: #1e293b; --text-muted: #64748b;
            --border-color: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); padding-bottom: 80px; }
        .marquee-container { background: #fef3c7; color: #92400e; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 700; overflow: hidden; white-space: nowrap; border-bottom: 1px solid #fde68a; }
        .marquee-content { display: inline-block; padding-left: 100%; animation: marquee 18s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        header { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: white; padding: 2rem 1rem 1.5rem; text-align: center; box-shadow: var(--shadow); }
        .header-title { font-size: 2.2rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 0.3rem; }
        .track-order-top-btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.5rem; }
        .container { max-width: 1000px; margin: 0 auto; padding: 1rem; }
        .reorder-card { background: #eff6ff; border: 1px dashed var(--primary-light); border-radius: var(--radius); padding: 0.85rem 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .closed-overlay { background: #fee2e2; color: #991b1b; padding: 1rem; text-align: center; font-weight: bold; border-radius: var(--radius); margin-bottom: 1.5rem; display: none; }
        .category-nav { display: flex; overflow-x: auto; white-space: nowrap; padding: 0.75rem 0; margin-bottom: 1.5rem; background: white; border-radius: var(--radius); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
        .category-btn { background: none; border: none; padding: 0.6rem 1.2rem; font-size: 0.95rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 20px; margin: 0 0.25rem; }
        .category-btn.active { color: white; background-color: var(--primary); }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
        .menu-card { background: white; border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .menu-card.sold-out { opacity: 0.5; cursor: not-allowed; background: #f1f5f9; }
        .item-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.25rem; }
        .item-price { font-weight: 700; color: var(--accent); }
        .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
        .modal-backdrop.active { opacity: 1; pointer-events: auto; }
        .modal-card { background: white; border-radius: var(--radius); width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 1.5rem; }
        .options-flex { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .option-chip { padding: 0.5rem 0.9rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.85rem; cursor: pointer; background: white; }
        .option-chip.selected { background-color: var(--primary); color: white; border-color: var(--primary); }
        .cart-bar { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); width: calc(100% - 2rem); max-width: 960px; background-color: var(--text-dark); color: white; padding: 0.8rem 1.2rem; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; z-index: 50; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .btn-primary { background-color: #06c755; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 20px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 1rem; }
        .form-input, .form-select { width: 100%; padding: 0.6rem; margin-top: 0.3rem; margin-bottom: 0.8rem; border: 1px solid var(--border-color); border-radius: 6px; }
        .order-status-card { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 10px; padding: 1rem; margin-bottom: 0.8rem; }
        .status-badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .status-prep { background: #fef3c7; color: #92400e; }
        .status-done { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="marquee-container">
        <div class="marquee-content">🎉 全店慶慶祝中！單筆點餐滿 $300 元即免費贈送『招牌風鳥茶』乙杯！</div>
    </div>
    <header>
        <div class="header-title">風鳥堂林口中山店</div>
        <div style="font-size: 0.9rem; opacity: 0.85;">官方 LINE ID: @694hwlae ‧ 營業時間 11:00 ~ 22:00</div>
        <button class="track-order-top-btn" onclick="openTrackModal()"><i class="fa-solid fa-magnifying-glass-location"></i> 🔍 查詢我的訂單狀態</button>
    </header>

    <div class="container">
        <div class="reorder-card" id="reorderCard" style="display: none;">
            <div>
                <div style="font-size: 0.9rem; font-weight: 700; color: var(--primary);">一鍵快速再點</div>
                <div id="reorderSummary" style="font-size: 0.8rem; color: var(--text-muted);"></div>
            </div>
            <button style="background:var(--primary); color:white; border:none; padding:0.4rem 0.8rem; border-radius:20px; font-weight:bold; cursor:pointer;" onclick="applyLastOrder()">直接套用</button>
        </div>
        <div class="closed-overlay" id="closedOverlay"><i class="fa-solid fa-store-slash"></i> 目前為非營業時間，暫不開放線上點餐！</div>
        <nav class="category-nav" id="categoryNav"></nav>
        <div id="menuContainer"><div style="text-align:center; padding:3rem;"><i class="fa-solid fa-spinner fa-spin"></i> 菜單載入中...</div></div>
    </div>

    <div class="cart-bar" onclick="openCartModal()">
        <div><i class="fa-solid fa-shopping-bag"></i> <span id="cartCount" style="background:var(--accent); padding:0.2rem 0.6rem; border-radius:20px; font-weight:bold; margin-left:0.5rem;">0</span></div>
        <div>總計: <span id="cartTotal" style="font-weight:700; font-size:1.1rem;">$0</span> <span style="font-size:0.85rem; margin-left:0.5rem;">前往結帳 ➔</span></div>
    </div>

    <!-- 🔍 嚴格比對電話的查詢 Modal -->
    <div class="modal-backdrop" id="trackModal">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <div style="font-weight:bold; font-size:1.1rem;"><i class="fa-solid fa-magnifying-glass"></i> 查詢您的訂單備餐進度</div>
                <button onclick="closeModal('trackModal')" style="background:none; border:none; font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.8rem;">
                請輸入您**完整的聯絡電話**（例如 0912345678）進行查詢：
            </div>
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                <input type="tel" id="trackPhoneInput" class="form-input" style="margin-bottom:0;" placeholder="完整手機號碼">
                <button class="btn-primary" style="margin-top:0; width: 100px;" onclick="searchMyOrders()">查詢</button>
            </div>
            <div id="trackResultContainer" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- 商品規格 Modal -->
    <div class="modal-backdrop" id="itemModal">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <div><div id="modalItemName" style="font-size:1.2rem; font-weight:bold;"></div><div id="modalItemPrice" style="color:var(--accent); font-weight:bold;"></div></div>
                <button onclick="closeModal('itemModal')" style="background:none; border:none; font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="font-weight:bold; font-size:0.9rem; margin-bottom:0.4rem;">甜度</div>
            <div class="options-flex" id="sweetnessOptions">
                <div class="option-chip selected" onclick="selectOpt(this, 's')">多糖</div>
                <div class="option-chip" onclick="selectOpt(this, 's')">正常糖</div>
                <div class="option-chip" onclick="selectOpt(this, 's')">少糖(7分)</div>
                <div class="option-chip" onclick="selectOpt(this, 's')">半糖(5分)</div>
                <div class="option-chip" onclick="selectOpt(this, 's')">微糖(3分)</div>
                <div class="option-chip" onclick="selectOpt(this, 's')">無糖</div>
            </div>
            <div style="font-weight:bold; font-size:0.9rem; margin-bottom:0.4rem;">冰塊</div>
            <div class="options-flex" id="iceOptions">
                <div class="option-chip selected" onclick="selectOpt(this, 'i')">多冰</div>
                <div class="option-chip" onclick="selectOpt(this, 'i')">正常冰</div>
                <div class="option-chip" onclick="selectOpt(this, 'i')">少冰</div>
                <div class="option-chip" onclick="selectOpt(this, 'i')">微冰</div>
                <div class="option-chip" onclick="selectOpt(this, 'i')">去冰</div>
                <div class="option-chip" onclick="selectOpt(this, 'i')">溫熱</div>
            </div>
            <button class="btn-primary" onclick="confirmAddToCart()">加入購物車</button>
        </div>
    </div>

    <!-- 購物車 Modal -->
    <div class="modal-backdrop" id="cartModal">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <div style="font-weight:bold; font-size:1.1rem;">您的點餐明細</div>
                <button onclick="closeModal('cartModal')" style="background:none; border:none; font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cartItemsList"></div>
            <div style="border-top: 2px solid var(--border-color); padding-top: 1rem; margin-top: 1rem;">
                <label style="font-size: 0.85rem; font-weight: bold;">預計取餐時間</label>
                <select id="custPickupTime" class="form-select"></select>
                <label style="font-size: 0.85rem; font-weight: bold;">訂購人姓名</label>
                <input type="text" id="custName" class="form-input" placeholder="請輸入姓名">
                <label style="font-size: 0.85rem; font-weight: bold;">聯絡電話</label>
                <input type="tel" id="custPhone" class="form-input" placeholder="0912345678">
                <button class="btn-primary" onclick="submitOrder()">送出訂單至 LINE ➔</button>
            </div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1_5ynzti6fA6RUq5UUjB28oxw2u2eFMs4RiGRzUmKvQU';
        const MENU_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;
        const ORDERS_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=` + encodeURIComponent('訂單紀錄') + `&t=` + new Date().getTime();
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxpuB_w20nq4ZtldzABmuVqu-iUUgDFW1nBQpuFP2j_8Yj2cv7qla-atfDfCWDFxxb5RA/exec';

        let menuData = [], cart = [], currentItem = null, selSweet = '多糖', selIce = '多冰';

        async function fetchMenu() {
            try {
                const res = await fetch(MENU_URL);
                const json = JSON.parse((await res.text()).substring(47, res.length - 2));
                const categoriesMap = {};
                json.table.rows.forEach(row => {
                    const c = row.c;
                    if (!c) return;
                    const catId = c[0] ? String(c[0].v || '') : '';
                    const catTitle = c[1] ? String(c[1].v || '') : '';
                    const rawName = c[2] ? String(c[2].v || '') : '';
                    const price = c[3] ? Number(c[3].v || 0) : 0;
                    const status = c[5] ? String(c[5].v || '上架') : '上架';
                    if (!rawName || rawName === '平台開關' || status === '下架') return;
                    if (!categoriesMap[catId]) categoriesMap[catId] = { id: catId, title: catTitle, items: [] };
                    categoriesMap[catId].items.push({ name: rawName, price, status });
                });
                menuData = Object.values(categoriesMap);
                renderMenu();
                checkLastOrder();
            } catch (e) { console.error(e); }
        }

        function renderMenu() {
            document.getElementById('categoryNav').innerHTML = menuData.map(cat => `<button class="category-btn" onclick="scrollToCat('${cat.id}')">${cat.title.split('（')[0]}</button>`).join('');
            document.getElementById('menuContainer').innerHTML = menuData.map(cat => `
                <div id="${cat.id}" style="margin-bottom:1.5rem;">
                    <div style="font-size:1.2rem; font-weight:bold; color:var(--primary); margin-bottom:0.8rem; border-bottom:2px solid var(--border-color); padding-bottom:0.3rem;">${cat.title}</div>
                    <div class="menu-grid">${cat.items.map(i => `
                        <div class="menu-card ${i.status === '售完' ? 'sold-out' : ''}" onclick="${i.status === '售完' ? '' : `openItemModal('${i.name}', ${i.price})`}">
                            <div><div class="item-name">${i.name} ${i.status === '售完' ? '<span style="background:#94a3b8; color:white; font-size:0.75rem; padding:0.1rem 0.4rem; border-radius:4px;">已售完</span>' : ''}</div><div class="item-price">$${i.price}</div></div>
                            <button style="background:#f1f5f9; border:none; width:35px; height:35px; border-radius:50%; color:var(--primary); font-weight:bold;"><i class="fa-solid fa-plus"></i></button>
                        </div>`).join('')}
                    </div>
                </div>`).join('');
        }

        function scrollToCat(id) { document.getElementById(id).scrollIntoView({ behavior: 'smooth' }); }

        function openItemModal(name, price) {
            currentItem = { name, price };
            selSweet = '多糖'; selIce = '多冰';
            document.getElementById('modalItemName').innerText = name;
            document.getElementById('modalItemPrice').innerText = `$${price}`;
            document.getElementById('itemModal').classList.add('active');
        }

        function selectOpt(el, type) {
            el.parentElement.querySelectorAll('.option-chip').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            if (type === 's') selSweet = el.innerText;
            if (type === 'i') selIce = el.innerText;
        }

        function confirmAddToCart() {
            cart.push({ id: Date.now(), name: currentItem.name, finalPrice: currentItem.price, sweetness: selSweet, ice: selIce, qty: 1 });
            updateCart();
            closeModal('itemModal');
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cartTotal').innerText = `$${cart.reduce((s, i) => s + (i.finalPrice * i.qty), 0)}`;
        }

        function openCartModal() {
            if (cart.length === 0) { alert('購物車是空的'); return; }
            document.getElementById('cartItemsList').innerHTML = cart.map(i => `<div style="display:flex; justify-content:space-between; padding:0.5rem 0; border-bottom:1px solid var(--border-color);"><div><b>${i.name}</b><br><small style="color:var(--text-muted);">${i.sweetness} / ${i.ice}</small></div><div style="color:var(--accent); font-weight:bold;">$${i.finalPrice * i.qty}</div></div>`).join('');
            generatePickupTimes();
            document.getElementById('cartModal').classList.add('active');
        }

        function generatePickupTimes() {
            const sel = document.getElementById('custPickupTime');
            sel.innerHTML = '';
            let m = Math.ceil((new Date().getHours() * 60 + new Date().getMinutes() + 15) / 15) * 15;
            for (let i = 0; i < 6; i++) {
                let timeStr = `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
                sel.innerHTML += `<option value="${timeStr} 取餐">${timeStr} 取餐</option>`;
                m += 15;
            }
        }

        function saveLastOrder(finalCart) {
            try { localStorage.setItem('feng_last_order', JSON.stringify(finalCart)); } catch(e){}
        }

        function checkLastOrder() {
            try {
                const saved = localStorage.getItem('feng_last_order');
                if (saved) {
                    const lastCart = JSON.parse(saved);
                    if (lastCart && lastCart.length > 0) {
                        document.getElementById('reorderSummary').innerText = lastCart.map(i => `${i.name} x${i.qty}`).join(', ');
                        document.getElementById('reorderCard').style.display = 'flex';
                    }
                }
            } catch(e){}
        }

        function applyLastOrder() {
            try {
                const saved = localStorage.getItem('feng_last_order');
                if (saved) {
                    cart = JSON.parse(saved).map(i => ({ ...i, id: Date.now() + Math.random() }));
                    updateCart();
                    alert('已套用上次點餐品項！');
                }
            } catch(e){ alert('套用失敗'); }
        }

        function submitOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            if (!name || !phone) { alert('請填寫姓名與電話'); return; }

            const total = cart.reduce((s,i)=>s+i.finalPrice*i.qty,0);
            const orderData = { name, phone, pickupTime: document.getElementById('custPickupTime').value, payMethod: 'LINE Pay', note: '', total, cart };
            
            saveLastOrder(cart);

            let itemsDetail = cart.map(i => `• ${i.name} x${i.qty}\n  (${i.sweetness} / ${i.ice}) - $${i.finalPrice * i.qty}`).join('\n');
            const lineMsg = `📋 【風鳥堂 - 線上點餐單】\n👤 訂購人：${name}\n📞 電話：${phone}\n⏰ 取餐時間：${orderData.pickupTime}\n------------------------------\n品項明細：\n${itemsDetail}\n------------------------------\n💰 總金額：$${total} 元\n✅ 訂單已送出！`;
            const lineUrl = `https://line.me/R/oaMessage/@694hwlae/?${encodeURIComponent(lineMsg)}`;

            const form = document.createElement('form');
            form.method = 'POST'; form.action = GAS_WEB_APP_URL; form.target = '_blank';
            const input = document.createElement('input'); input.type = 'hidden'; input.name = 'orderJson'; input.value = JSON.stringify(orderData);
            form.appendChild(input); document.body.appendChild(form); form.submit(); document.body.removeChild(form);

            cart = []; updateCart(); closeModal('cartModal');
            setTimeout(() => { window.location.href = lineUrl; }, 400);
        }

        function openTrackModal() { document.getElementById('trackModal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // 🔍 嚴格完全相符查詢（防止輸入部分數字查到別人）
        async function searchMyOrders() {
            const phoneInput = document.getElementById('trackPhoneInput').value.trim();
            const container = document.getElementById('trackResultContainer');
            if (!phoneInput) { alert('請輸入完整電話'); return; }
            
            container.innerHTML = `<div style="text-align:center; padding:1rem;">查詢中...</div>`;
            try {
                const res = await fetch(ORDERS_URL);
                const json = JSON.parse((await res.text()).substring(47, res.length - 2));
                let myOrders = [];

                json.table.rows.forEach(row => {
                    const c = row.c;
                    if (!c) return;
                    let orderPhone = c[3] ? String(c[3].v || '').replace(/'/g, '').trim() : '';
                    
                    if (orderPhone === phoneInput) {
                        myOrders.push({
                            time: c[1] ? (c[1].f || c[1].v || '') : '',
                            name: c[2] ? String(c[2].v || '') : '',
                            items: c[5] ? String(c[5].v || '') : '',
                            total: c[6] ? Number(c[6].v || 0) : 0,
                            status: c[8] ? String(c[8].v || '備餐中') : '備餐中'
                        });
                    }
                });

                if (myOrders.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:1rem;">查無此電話之訂單記錄，請確認號碼是否完全正確。</div>`;
                    return;
                }

                container.innerHTML = myOrders.map(o => `
                    <div class="order-status-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem;">
                            <strong>${o.name} (${o.time})</strong>
                            <span class="status-badge ${o.status === '已完成' ? 'status-done' : 'status-prep'}">${o.status}</span>
                        </div>
                        <div style="font-size:0.85rem; color:var(--text-muted); white-space:pre-line;">${o.items}</div>
                        <div style="font-weight:bold; color:var(--accent); text-align:right;">總金額: $${o.total}</div>
                    </div>`).join('');
            } catch (e) {
                container.innerHTML = `<div style="text-align:center; color:red; padding:1rem;">查詢失敗</div>`;
            }
        }

        fetchMenu();
    </script>
</body>
</html>
