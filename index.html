<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風鳥堂 - 線上訂餐</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --accent: #d97706;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            padding: 2.5rem 1rem 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
        }

        .header-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .header-subtitle {
            font-size: 0.95rem;
            opacity: 0.85;
            font-weight: 300;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
        }

        .category-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 0.75rem 0;
            margin-bottom: 1.5rem;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .category-nav::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            background: none;
            border: none;
            padding: 0.6rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 20px;
            margin: 0 0.25rem;
        }

        .category-btn.active, .category-btn:hover {
            color: white;
            background-color: var(--primary);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 1.5rem 0 1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .menu-card {
            background: white;
            border-radius: var(--radius);
            padding: 1rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid transparent;
        }

        .menu-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-light);
        }

        .item-info {
            flex: 1;
            padding-right: 1rem;
        }

        .item-name {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 0.25rem;
            color: var(--text-dark);
        }

        .item-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-price {
            font-weight: 700;
            color: var(--accent);
            font-size: 1rem;
        }

        .add-btn {
            background-color: #f1f5f9;
            color: var(--primary);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .menu-card:hover .add-btn {
            background-color: var(--primary);
            color: white;
        }

        /* Modal Base */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: white;
            border-radius: var(--radius);
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            transform: translateY(20px);
            transition: transform 0.25s ease;
        }

        .modal-backdrop.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .option-group {
            margin-bottom: 1.25rem;
        }

        .option-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .options-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .option-chip {
            padding: 0.5rem 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
        }

        .option-chip.selected {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Cart Bar Floating */
        .cart-bar {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2rem);
            max-width: 960px;
            background-color: var(--text-dark);
            color: white;
            padding: 0.8rem 1.2rem;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            z-index: 50;
            cursor: pointer;
        }

        .cart-badge {
            background-color: var(--accent);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-left: 0.5rem;
        }

        .cart-summary {
            display: flex;
            align-items: center;
        }

        .cart-total {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .btn-primary {
            background-color: #06c755;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background-color: #05b34c;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
        }

        .form-input {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.3rem;
            margin-bottom: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">風鳥堂</div>
        <div class="header-subtitle">嚴選台灣優質好茶 ‧ 精緻特調飲品專賣</div>
    </header>

    <div class="container">
        <!-- 分類導航欄 -->
        <nav class="category-nav" id="categoryNav">
            <button class="category-btn active" onclick="scrollToCategory('all')">全部商品</button>
            <button class="category-btn" onclick="scrollToCategory('cat-1')">🌿 台灣原生茶</button>
            <button class="category-btn" onclick="scrollToCategory('cat-2')">🧋 醇品奶茶</button>
            <button class="category-btn" onclick="scrollToCategory('cat-3')">🥛 馥韻鮮奶茶</button>
            <button class="category-btn" onclick="scrollToCategory('cat-4')">🌟 不老經典特調</button>
            <button class="category-btn" onclick="scrollToCategory('cat-5')">😊 穀果茶 (無咖啡因)</button>
            <button class="category-btn" onclick="scrollToCategory('cat-6')">❄️ 酷冰尼 / 冰尼茶</button>
        </nav>

        <!-- 菜單列表 -->
        <div id="menuContainer"></div>
    </div>

    <!-- 浮動購物車條 -->
    <div class="cart-bar" id="cartBar" onclick="openCartModal()">
        <div class="cart-summary">
            <i class="fa-solid fa-shopping-bag"></i>
            <span class="cart-badge" id="cartCount">0</span>
        </div>
        <div>
            總計: <span class="cart-total" id="cartTotal">$0</span>
            <span style="font-size: 0.85rem; margin-left: 0.5rem; opacity: 0.8;">前往結帳 ➔</span>
        </div>
    </div>

    <!-- 商品客製化 Modal -->
    <div class="modal-backdrop" id="itemModal">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="modalItemName">商品名稱</div>
                    <div style="color: var(--accent); font-weight: bold; margin-top: 0.2rem;" id="modalItemPrice">$0</div>
                </div>
                <button class="close-btn" onclick="closeModal('itemModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="option-group">
                <div class="option-title">甜度</div>
                <div class="options-flex" id="sweetnessOptions">
                    <div class="option-chip selected" onclick="selectOption(this, 'sweetness')">正常糖</div>
                    <div class="option-chip" onclick="selectOption(this, 'sweetness')">少糖 (7分)</div>
                    <div class="option-chip" onclick="selectOption(this, 'sweetness')">半糖 (5分)</div>
                    <div class="option-chip" onclick="selectOption(this, 'sweetness')">微糖 (3分)</div>
                    <div class="option-chip" onclick="selectOption(this, 'sweetness')">無糖 (0分)</div>
                </div>
            </div>

            <div class="option-group">
                <div class="option-title">冰塊</div>
                <div class="options-flex" id="iceOptions">
                    <div class="option-chip selected" onclick="selectOption(this, 'ice')">正常冰</div>
                    <div class="option-chip" onclick="selectOption(this, 'ice')">少冰</div>
                    <div class="option-chip" onclick="selectOption(this, 'ice')">微冰</div>
                    <div class="option-chip" onclick="selectOption(this, 'ice')">去冰</div>
                    <div class="option-chip" onclick="selectOption(this, 'ice')">熱飲</div>
                </div>
            </div>

            <div class="option-group">
                <div class="option-title">加料 (+10元)</div>
                <div class="options-flex" id="toppingOptions">
                    <div class="option-chip" onclick="toggleTopping(this, '波霸', 10)">波霸</div>
                    <div class="option-chip" onclick="toggleTopping(this, '手工藍莓凍', 15)">手工藍莓凍 (+15)</div>
                    <div class="option-chip" onclick="toggleTopping(this, '寒天晶球', 10)">寒天晶球</div>
                    <div class="option-chip" onclick="toggleTopping(this, '蘆薈果漾', 10)">蘆薈果漾</div>
                    <div class="option-chip" onclick="toggleTopping(this, '統一布丁', 15)">統一布丁 (+15)</div>
                </div>
            </div>

            <button class="btn-primary" style="background-color: var(--primary);" onclick="confirmAddToCart()">加入購物車</button>
        </div>
    </div>

    <!-- 購物車 Modal -->
    <div class="modal-backdrop" id="cartModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">您的點餐明細</div>
                <button class="close-btn" onclick="closeModal('cartModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="cartItemsList"></div>

            <div style="border-top: 2px solid var(--border-color); padding-top: 1rem; margin-top: 1rem;">
                <div class="option-title">取餐方式</div>
                <div class="options-flex" style="margin-bottom: 1rem;">
                    <div class="option-chip selected" onclick="selectOrderType(this, '外帶')">現場外帶</div>
                    <div class="option-chip" onclick="selectOrderType(this, '外送')">外送服務</div>
                </div>

                <label style="font-size: 0.85rem; font-weight: bold;">訂購人姓名</label>
                <input type="text" id="custName" class="form-input" placeholder="請輸入姓名">

                <label style="font-size: 0.85rem; font-weight: bold;">聯絡電話</label>
                <input type="tel" id="custPhone" class="form-input" placeholder="0912345678">

                <div id="addressGroup" style="display: none;">
                    <label style="font-size: 0.85rem; font-weight: bold;">外送地址</label>
                    <input type="text" id="custAddress" class="form-input" placeholder="請輸入外送完整地址">
                </div>

                <label style="font-size: 0.85rem; font-weight: bold;">備註需求</label>
                <input type="text" id="custNote" class="form-input" placeholder="例如：發票載具或預計取餐時間">

                <button class="btn-primary" onclick="submitOrder()">
                    <i class="fa-brands fa-line" style="font-size: 1.3rem;"></i> 複製訂單並開啟 LINE 送出
                </button>
            </div>
        </div>
    </div>

    <script>
        const menuData = [
            {
                id: 'cat-1',
                title: '🌿 台灣原生茶',
                items: [
                    { name: '招牌風鳥茶', price: 35, desc: '風鳥堂獨家配方，甘醇順口回甘' },
                    { name: '老派紅茶', price: 35, desc: '古早味紅茶香氣，經典不敗' },
                    { name: '日月潭阿薩姆紅茶', price: 40, desc: '茶香濃郁，帶有獨特麥芽香' },
                    { name: '鹿谷鮮綠茶', price: 35, desc: '清新綠茶香，口感爽朗' },
                    { name: '坪林高山烏龍茶', price: 40, desc: '高海拔高山茶，韻味悠長' },
                    { name: '名間四季春', price: 35, desc: '自然花香氣，順口不苦澀' },
                    { name: '黃金金萱烏龍', price: 40, desc: '帶有淡淡奶香與高山茶韻' },
                    { name: '東方美人茶', price: 45, desc: '獨特蜜香與果香，優雅回甘' }
                ]
            },
            {
                id: 'cat-2',
                title: '🧋 醇品奶茶',
                items: [
                    { name: '招牌風鳥奶茶', price: 50, desc: '招牌茶底調配，香醇完美比例' },
                    { name: '波霸奶茶', price: 55, desc: 'Q彈大波霸加上濃郁奶茶' },
                    { name: '文青高山奶烏龍', price: 50, desc: '烏龍茶香與奶香交織，層次豐富' },
                    { name: '午後的輕奶茶', price: 45, desc: '輕巧無負擔，順口微甜' },
                    { name: '玫瑰岩鹽奶茶', price: 55, desc: '咸甜交織，玫瑰花香誘人' },
                    { name: '手工藍莓凍奶茶', price: 60, desc: '滑嫩藍莓凍，酸甜果香奶茶' },
                    { name: '統一布丁奶茶', price: 60, desc: '整顆布丁加入，甜美滋味' },
                    { name: '皇家干邑奶茶', price: 60, desc: '奢華香氣，成熟風味奶茶' }
                ]
            },
            {
                id: 'cat-3',
                title: '🥛 馥韻鮮奶茶',
                items: [
                    { name: '風鳥鮮奶拿鐵', price: 65, desc: '優質鮮奶與招牌風鳥茶完美結合' },
                    { name: '老派紅鮮奶拿鐵', price: 65, desc: '古早味紅茶搭上濃醇小農鮮奶' },
                    { name: '阿薩姆鮮奶拿鐵', price: 70, desc: '茶感重，鮮奶香，奶茶控首選' },
                    { name: '英式伯爵鮮奶拿鐵', price: 70, desc: '佛手柑香氣與鮮奶的完美搭配' },
                    { name: '東方美人鮮奶拿鐵', price: 75, desc: '蜜香茶韻搭配鮮奶，極致享受' },
                    { name: '祇園抹茶鮮奶拿鐵', price: 75, desc: '日本日式抹茶粉，濃郁抹香' }
                ]
            },
            {
                id: 'cat-4',
                title: '🌟 不老經典特調',
                items: [
                    { name: '山草香茅綠', price: 50, desc: '草本香茅香氣，清爽解膩' },
                    { name: '蜜香凍檸茶', price: 55, desc: '新鮮檸檬切片加純蜂蜜與好茶' },
                    { name: '冬瓜四季春', price: 45, desc: '遵循古法冬瓜磚加上四季春茶' },
                    { name: '綠茶多多', price: 55, desc: '兩瓶養樂多搭配清新綠茶' }
                ]
            },
            {
                id: 'cat-5',
                title: '😊 穀果茶 (無咖啡因)',
                items: [
                    { name: '南非國寶茶', price: 45, desc: '無咖啡因，溫和順口無負擔' },
                    { name: '綠國寶茶', price: 45, desc: '未發酵國寶茶，清爽營養高' },
                    { name: '洋甘菊綠國寶茶', price: 50, desc: '舒緩洋甘菊香氣，放鬆首選' },
                    { name: '黃金蕎麥茶', price: 45, desc: '烘焙蕎麥香，無咖啡因可溫飲' },
                    { name: '梅子山楂洛神', price: 50, desc: '酸甜開胃，自然紅潤好氣色' },
                    { name: '百香雙果漾', price: 60, desc: '豐富百香果粒與豐富口感' }
                ]
            },
            {
                id: 'cat-6',
                title: '❄️ 酷冰尼 / 冰尼茶',
                items: [
                    { name: '可可拿鐵酷冰尼', price: 75, desc: '濃郁巧克力冰沙與鮮奶層次' },
                    { name: '爆珠四季冰尼茶', price: 70, desc: '水果爆珠咬下噴汁，冰爽暢快' },
                    { name: '玫瑰果紅莓酷冰尼', price: 75, desc: '酸甜莓果冰沙，夏日熱門' }
                ]
            }
        ];

        let cart = [];
        let currentItem = null;
        let selectedSweetness = '正常糖';
        let selectedIce = '正常冰';
        let selectedToppings = [];
        let orderType = '外帶';

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            menuData.forEach(cat => {
                const section = document.createElement('section');
                section.id = cat.id;
                
                let itemsHtml = cat.items.map(item => `
                    <div class="menu-card" onclick="openItemModal('${item.name}', ${item.price})">
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-desc">${item.desc}</div>
                            <div class="item-price">$${item.price}</div>
                        </div>
                        <button class="add-btn"><i class="fa-solid fa-plus"></i></button>
                    </div>
                `).join('');

                section.innerHTML = `
                    <div class="section-title">${cat.title}</div>
                    <div class="menu-grid">${itemsHtml}</div>
                `;
                container.appendChild(section);
            });
        }

        function scrollToCategory(id) {
            if (id === 'all') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }
            const el = document.getElementById(id);
            if (el) {
                const yOffset = -70;
                const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        }

        function openItemModal(name, price) {
            currentItem = { name, price };
            selectedSweetness = '正常糖';
            selectedIce = '正常冰';
            selectedToppings = [];

            document.getElementById('modalItemName').innerText = name;
            document.getElementById('modalItemPrice').innerText = `$${price}`;

            resetChipSelection('sweetnessOptions', 0);
            resetChipSelection('iceOptions', 0);
            document.querySelectorAll('#toppingOptions .option-chip').forEach(c => c.classList.remove('selected'));

            document.getElementById('itemModal').classList.add('active');
        }

        function resetChipSelection(groupId, defaultIdx) {
            const chips = document.querySelectorAll(`#${groupId} .option-chip`);
            chips.forEach((c, idx) => {
                if(idx === defaultIdx) c.classList.add('selected');
                else c.classList.remove('selected');
            });
        }

        function selectOption(el, type) {
            const parent = el.parentElement;
            parent.querySelectorAll('.option-chip').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');

            if (type === 'sweetness') selectedSweetness = el.innerText;
            if (type === 'ice') selectedIce = el.innerText;
        }

        function toggleTopping(el, name, price) {
            el.classList.toggle('selected');
            if (el.classList.contains('selected')) {
                selectedToppings.push({ name, price });
            } else {
                selectedToppings = selectedToppings.filter(t => t.name !== name);
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function confirmAddToCart() {
            const toppingCost = selectedToppings.reduce((sum, t) => sum + t.price, 0);
            const finalPrice = currentItem.price + toppingCost;

            const cartItem = {
                id: Date.now(),
                name: currentItem.name,
                basePrice: currentItem.price,
                finalPrice: finalPrice,
                sweetness: selectedSweetness,
                ice: selectedIce,
                toppings: [...selectedToppings],
                qty: 1
            };

            cart.push(cartItem);
            updateCart();
            closeModal('itemModal');
        }

        function updateCart() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = cart.reduce((sum, item) => sum + (item.finalPrice * item.qty), 0);

            document.getElementById('cartCount').innerText = count;
            document.getElementById('cartTotal').innerText = `$${total}`;
        }

        function openCartModal() {
            if (cart.length === 0) {
                alert('您的購物車目前是空的喔！');
                return;
            }

            const listContainer = document.getElementById('cartItemsList');
            listContainer.innerHTML = '';

            cart.forEach(item => {
                const toppingsText = item.toppings.length > 0 ? ` + ${item.toppings.map(t=>t.name).join(', ')}` : '';
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div>
                        <div style="font-weight: bold;">${item.name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">
                            ${item.sweetness} / ${item.ice}${toppingsText}
                        </div>
                        <div style="color: var(--accent); font-weight: bold; font-size: 0.9rem;">
                            $${item.finalPrice * item.qty}
                        </div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });

            document.getElementById('cartModal').classList.add('active');
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCart();
            if (cart.length === 0) {
                closeModal('cartModal');
            } else {
                openCartModal();
            }
        }

        function selectOrderType(el, type) {
            orderType = type;
            const parent = el.parentElement;
            parent.querySelectorAll('.option-chip').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');

            document.getElementById('addressGroup').style.display = type === '外送' ? 'block' : 'none';
        }

        function submitOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const note = document.getElementById('custNote').value.trim();

            if (!name || !phone) {
                alert('請填寫姓名與聯絡電話！');
                return;
            }

            if (orderType === '外送' && !address) {
                alert('請填寫外送地址！');
                return;
            }

            const total = cart.reduce((sum, item) => sum + (item.finalPrice * item.qty), 0);
            
            let orderSummary = `【風鳥堂 點餐明細】\n`;
            orderSummary += `取餐類別：${orderType}\n`;
            orderSummary += `訂購人：${name} (${phone})\n`;
            if (orderType === '外送') orderSummary += `地址：${address}\n`;
            orderSummary += `-------------------\n`;
            cart.forEach(item => {
                const toppingsText = item.toppings.length > 0 ? ` + ${item.toppings.map(t=>t.name).join(', ')}` : '';
                orderSummary += `• ${item.name} x${item.qty} ($${item.finalPrice * item.qty})\n  (${item.sweetness}/${item.ice}${toppingsText})\n`;
            });
            orderSummary += `-------------------\n`;
            orderSummary += `金額總計：$${total} 元\n`;
            if (note) orderSummary += `備註：${note}\n`;

            // 複製訂單文字到剪貼簿
            navigator.clipboard.writeText(orderSummary).then(() => {
                alert('【訂單明細已自動複製！】\n\n系統將為您開啟風鳥堂 LINE 官方帳號，請在對話框中【長按貼上】並發送即可！');
                // 開啟 LINE 官方帳號對話視窗
                window.location.href = "https://line.me/R/ti/p/@694hwlae";
            }).catch(() => {
                // 如果瀏覽器限制剪貼簿，備用跳轉
                alert('系統將開啟風鳥堂 LINE 官方帳號，請將訂單訊息發送給我們！');
                window.location.href = "https://line.me/R/ti/p/@694hwlae";
            });
        }

        renderMenu();
    </script>
</body>
</html>
